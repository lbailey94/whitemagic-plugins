# WhiteMagic for Codex CLI — append to ~/.codex/config.toml
# (or a trusted project's .codex/config.toml).

[mcp_servers.whitemagic]
command = "npx"
args = ["-y", "whitemagic-mcp@11.2.1", "serve", "--profile", "cyberbrain"]
startup_timeout_sec = 30

# Native Gen3 11.2.1 binary alternative (Linux / Apple Silicon macOS):
# [mcp_servers.whitemagic]
# command = "/absolute/path/to/wm"
# args = ["--store", "/absolute/path/to/whitemagic/gen3", "serve", "--profile", "cyberbrain"]
#
# Windows (x86_64) & Intel macOS (x86_64) fallback (Gen2 9.3.4):
# args = ["-y", "whitemagic-mcp@9.3.4", "serve", "--profile", "curated"]

# User skills: ~/.agents/skills (no [features] skills toggle required).
