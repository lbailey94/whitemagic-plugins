# WhiteMagic for Codex CLI — append to ~/.codex/config.toml
# (or a trusted project's .codex/config.toml).

[mcp_servers.whitemagic]
command = "npx"
args = ["-y", "whitemagic-mcp@9.3.4", "serve", "--profile", "curated"]
startup_timeout_sec = 30

# Native binary alternative:
# [mcp_servers.whitemagic]
# command = "/absolute/path/to/whitemagic-gen2/bin/wm" # Gen2 9.3.4
# args = ["serve", "--profile", "curated"]

# User skills: ~/.agents/skills (no [features] skills toggle required).
